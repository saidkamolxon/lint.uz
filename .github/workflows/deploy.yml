name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two workers: the site, which serves the landing page and every tool at
# lint.one/<tool>, and the redirect, which sends lint.uz and the old
# subdomains there. The tools are no longer workers of their own.

jobs:
  filter:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.changes.outputs.site }}
      redirect: ${{ steps.changes.outputs.redirect }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          # every tool folder is part of the site — a new tool must be listed
          # here, or changes to it alone never deploy
          filters: |
            site:
              - 'shared/**'
              - 'build.mjs'
              - '.github/workflows/deploy.yml'
              - 'site/**'
              - 'json/**'
              - 'xml/**'
              - 'yaml/**'
              - 'csv/**'
              - 'pdf/**'
              - 'log/**'
              - 'audio/**'
            redirect:
              - 'redirect/**'
              - '.github/workflows/deploy.yml'

  deploy:
    name: Deploy ${{ matrix.worker }}
    needs: filter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: site
            changed: ${{ needs.filter.outputs.site }}
          - worker: redirect
            changed: ${{ needs.filter.outputs.redirect }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'

      - uses: actions/setup-node@v4
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: 22

      - name: Assemble site/dist
        if: matrix.worker == 'site' && (matrix.changed == 'true' || github.event_name == 'workflow_dispatch')
        run: node build.mjs

      - name: Deploy
        if: matrix.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # the action's default wrangler (3.x) cannot read wrangler.jsonc
          wranglerVersion: '4'
          workingDirectory: ${{ matrix.worker }}
          command: deploy
