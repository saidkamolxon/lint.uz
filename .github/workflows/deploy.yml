name: Deploy Viewers to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  filter:
    name: Detect Changed Viewers
    runs-on: ubuntu-latest
    outputs:
      json: ${{ steps.changes.outputs.json }}
      xml: ${{ steps.changes.outputs.xml }}
      yaml: ${{ steps.changes.outputs.yaml }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            json:
              - 'json/**'
              - '.github/workflows/deploy.yml'
            xml:
              - 'xml/**'
              - '.github/workflows/deploy.yml'
            yaml:
              - 'yaml/**'
              - '.github/workflows/deploy.yml'

  deploy-json:
    name: Deploy json.lint.uz
    needs: filter
    if: needs.filter.outputs.json == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy JSON Viewer
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'json'
          command: deploy

  deploy-xml:
    name: Deploy xml.lint.uz
    needs: filter
    if: needs.filter.outputs.xml == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy XML Viewer
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'xml'
          command: deploy

  deploy-yaml:
    name: Deploy yaml.lint.uz
    needs: filter
    if: needs.filter.outputs.yaml == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy YAML Viewer
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'yaml'
          command: deploy
