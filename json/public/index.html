<script>

  hue: '#4F46E5',
  hueInk: '#FFFFFF',
  accept: '.json,.jsonl,.ndjson,.jsonc,.txt,application/json',
  placeholder: 'Paste JSON or drop a file…',
  searchPlaceholder: 'Search keys and values…',
  actions: [
    { id: 'btnFormat', label: 'Format', primary: true, key: 'shift+alt+f', title: 'Put every value on its own line, indented two spaces per level' },
    { id: 'btnMinify', label: 'Minify', title: 'Remove all whitespace to make the document as small as possible' }
  ],
  /* Convert to ▾ offers only what this document can become: the rules
     are set with LintApp.when below, beside the state they read */

    { id: 'btnToYaml', label: 'YAML', key: 'mod+shift+y', title: 'Convert this document to YAML and open it in the YAML viewer (also copied)' },
    { id: 'btnToCsv', label: 'CSV', title: 'An array of records, or JSON Lines, as a CSV table in the CSV viewer (also copied)' },
    { id: 'btnToLines', label: 'JSON Lines', title: 'A JSON array into JSON Lines: one record per line (.jsonl, .ndjson)' },
    { id: 'btnToArray', label: 'JSON array', title: 'JSON Lines, one record per line, into one JSON array' },
    { id: 'btnToLog', label: 'LOG', title: 'Read these JSON Lines as a log: filter by severity, fold stack traces' }
  ],
  ext: 'json',
  /* rarer commands, listed in the ⋮ menu ahead of Load a sample */

<script>
(function () {
'use strict';

var esc = LintApp.esc;

/* ==========================================================================
   Syntax highlighting
   One regex pass over the source; everything not matched is escaped text.
   ========================================================================== */
var TOKEN = /("(?:[^"\\]|\\.)*"\s*:)|("(?:[^"\\]|\\.)*")|(-?\d+\.?\d*(?:[eE][+-]?\d+)?)|(\btrue\b|\bfalse\b)|(\bnull\b)|([{}\[\],:])/g;

function highlight(text) {
  var out = '', last = 0, m;
  TOKEN.lastIndex = 0;
  while ((m = TOKEN.exec(text)) !== null) {
    if (m.index > last) out += esc(text.slice(last, m.index));
    var cls = m[1] ? 'hl-key' : m[2] ? 'hl-str' : m[3] ? 'hl-num'
            : m[4] ? 'hl-bool' : m[5] ? 'hl-null' : 'hl-punct';
    out += '<span class="' + cls + '">' + esc(m[0]) + '</span>';
    last = m.index + m[0].length;
  }
  out += esc(text.slice(last));
  return out;
}

/* ==========================================================================
   Parsing
   JSON.parse gives a character offset but no line/column — derive them so
   the gutter can mark the bad line.
   ========================================================================== */
/* JSON Lines (.jsonl, .ndjson): one JSON value per line. A document that
   does not parse whole, but whose lines do, is read that way: the records
   become one array for the tree, and a bad line is marked in the gutter
   while the rest are still shown. */
var docValue;                // the last parse, for what Convert to offers
var jsonl = null;            // {records, bad: [{line, message}]} in JSON Lines mode
var offeredLog = false;     // the LOG viewer was offered for this document
var offeredHar = false;     // the HAR viewer was offered for this document

function parseLines(text) {
  var rows = text.split('\n'), records = [], bad = [], first = true;
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i].trim();
    if (!r) continue;
    try { records.push(JSON.parse(r)); }
    catch (e) {
      if (first) return null;
      bad.push({ line: i + 1, message: String(e.message || 'Invalid JSON').replace(/^JSON\.parse:\s*/, '').replace(/\s*(?:in JSON )?at position \d+.*$/i, '') });
    }
    first = false;
  }
  return records.length >= 2 || (records.length && bad.length) ? { records: records, bad: bad } : null;
}

function parse(text) {
  jsonl = null;
  try {
    return { ok: true, value: JSON.parse(text) };
  } catch (e) {
    var jl = parseLines(text);
    if (jl) { jsonl = jl; return { ok: true, value: jl.records }; }
    var msg = e.message || 'Invalid JSON';
    var pos = null;

    var mPos = msg.match(/position (\d+)/i);
    if (mPos) pos = parseInt(mPos[1], 10);

    var line = null, col = null;
    var mLine = msg.match(/line (\d+) column (\d+)/i);
    if (mLine) {
      line = parseInt(mLine[1], 10);
      col = parseInt(mLine[2], 10);
    } else if (pos !== null) {
      var before = text.slice(0, pos).split('\n');
      line = before.length;
      col = before[before.length - 1].length + 1;
    }

    /* strip the engine's own position suffix — we render it separately */
    msg = msg
      .replace(/^JSON\.parse:\s*/, '')
      .replace(/\s*(?:in JSON )?at position \d+.*$/i, '')
      .replace(/\s*at line \d+ column \d+.*$/i, '');

    return { ok: false, message: msg, pos: pos, line: line, col: col };
  }
}

function typeOf(v) {
  if (v === null) return 'null';
  if (Array.isArray(v)) return 'array';
  return typeof v;
}

function sizeOf(v) {
  if (!v || typeof v !== 'object') return 0;
  return Array.isArray(v) ? v.length : Object.keys(v).length;
}

function stats(value) {
  var nodes = 0, depth = 0;
  (function walk(v, d) {
    nodes++;
    if (d > depth) depth = d;
    if (v && typeof v === 'object') {
      if (Array.isArray(v)) for (var i = 0; i < v.length; i++) walk(v[i], d + 1);
      else for (var k in v) walk(v[k], d + 1);
    }
  })(value, 1);
  if (jsonl) {
    return 'JSON Lines · ' + LintApp.fmtNum(jsonl.records.length) + (jsonl.records.length === 1 ? ' record' : ' records') +
      (jsonl.bad.length ? ' · ' + jsonl.bad.length + (jsonl.bad.length === 1 ? ' invalid line' : ' invalid lines') : '');
  }
  return LintApp.fmtNum(nodes) + ' nodes, depth ' + depth;
}

/* ==========================================================================
   Tree adapter
   ========================================================================== */
var IDENT = /^[A-Za-z_$][A-Za-z0-9_$]*$/;

function pathString(path) {
  var s = '$';
  for (var i = 0; i < path.length; i++) {
    var seg = path[i];
    if (typeof seg === 'number') s += '[' + seg + ']';
    else if (IDENT.test(seg)) s += '.' + seg;
    else s += '[' + JSON.stringify(seg) + ']';
  }
  return s;
}

var TICON = {
  object: ['obj', '{}'], array: ['arr', '[]'], string: ['str', 'ab'],
  number: ['num', '#'], boolean: ['bool', '◑'], null: ['null', '∅']
};

var adapter = {
  pathLabel: 'Path',

  rootEntry: function (value) { return { key: undefined, value: value, path: [] }; },

  children: function (e) {
    var v = e.value;
    if (!v || typeof v !== 'object') return [];
    var out = [];
    if (Array.isArray(v)) {
      for (var i = 0; i < v.length; i++) out.push({ key: i, value: v[i], path: e.path.concat([i]) });
    } else {
      var keys = Object.keys(v);
      for (var j = 0; j < keys.length; j++) {
        out.push({ key: keys[j], value: v[keys[j]], path: e.path.concat([keys[j]]) });
      }
    }
    return out;
  },

  childCount: function (e) { return sizeOf(e.value); },

  matches: function (e, q) {
    if (typeof e.key === 'string' && e.key.toLowerCase().indexOf(q) !== -1) return true;
    var t = typeOf(e.value);
    if (t === 'object' || t === 'array') return false;
    return String(e.value).toLowerCase().indexOf(q) !== -1;
  },

  path: function (e) { return pathString(e.path); },

  decorate: function (row, e, q, util) {
    var t = typeOf(e.value);
    var spec = TICON[t] || TICON.object;

    var icon = document.createElement('span');
    icon.className = 'ticon t-' + spec[0];
    icon.textContent = t === 'boolean' ? (e.value ? '✓' : '✕') : spec[1];
    icon.title = t;
    row.appendChild(icon);

    if (e.key !== undefined) {
      var k = document.createElement('span');
      k.className = 'k' + (typeof e.key === 'number' ? ' idx' : '');
      util.highlightInto(k, typeof e.key === 'number' ? '[' + e.key + ']' : String(e.key), q);
      row.appendChild(k);
      var colon = document.createElement('span');
      colon.className = 'colon';
      colon.textContent = ':';
      row.appendChild(colon);
    }

    if (t === 'object' || t === 'array') {
      var n = sizeOf(e.value);
      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = t === 'array' ? (n ? '[ … ]' : '[ ]') : (n ? '{ … }' : '{ }');
      if (n) {
        var cnt = document.createElement('span');
        cnt.className = 'cnt';
        cnt.textContent = n + (t === 'array'
          ? (n === 1 ? ' item' : ' items')
          : (n === 1 ? ' key' : ' keys'));
        badge.appendChild(cnt);
      }
      row.appendChild(badge);
    } else {
      var v = document.createElement('span');
      v.className = 'v ' + (t === 'boolean' ? 'bool' : t === 'string' ? 'str' : t);
      if (t === 'string' && e.value.length > util.STR_TRUNC) {
        var full = e.value;
        util.highlightInto(v, full.slice(0, util.STR_TRUNC) + '…', q);
        var more = document.createElement('button');
        more.className = 'trunc-btn';
        more.textContent = '+' + LintApp.fmtNum(full.length - util.STR_TRUNC) + ' chars';
        more.title = 'Show the whole string';
        more.addEventListener('click', function (ev) {
          ev.stopPropagation();
          v.textContent = '';
          util.highlightInto(v, full, q);
        });
        v.appendChild(more);
      } else {
        util.highlightInto(v, String(e.value), q);
      }
      row.appendChild(v);
    }
  },

  actions: function (e) {
    return [
      { label: 'path', title: 'Copy path', toastLabel: 'Path',
        get: function () { return pathString(e.path); } },
      /* a string as its text, without the quotes; the rest as JSON */
      { label: 'value', title: 'Copy value', toastLabel: 'Value',
        get: function () { return typeof e.value === 'string' ? e.value : JSON.stringify(e.value, null, 2); } }
    ];
  },

  link: function (e) { return LintApp.linkIn(e.value); },

  /* an object or list inside the document, opened as a document of its own */
  subtree: function (e) {
    var t = typeOf(e.value);
    if (!e.path.length || (t !== 'object' && t !== 'array')) return null;
    return { title: 'Open in new JSON tab', tool: 'json', name: LintApp.pathName(e.path) + '.json',
      text: JSON.stringify(e.value, null, 2) };
  }
};


/* ==========================================================================
   JSON -> YAML
   Only has to serialise what JSON.parse can produce: objects, arrays,
   strings, finite numbers, booleans and null. That is a small enough
   grammar to do correctly here rather than ship a 60 KB YAML library.
   ========================================================================== */

/* A plain (unquoted) scalar is only safe when it cannot be mistaken for
   another YAML type or for structure. When in doubt, quote. */
var YAML_RESERVED = /^(|~|null|Null|NULL|true|True|TRUE|false|False|FALSE|y|Y|n|N|yes|Yes|YES|no|No|NO|on|On|ON|off|Off|OFF)$/;
var YAML_NUMERIC = /^[-+]?(\d[\d_]*(\.\d*)?|\.\d+)([eE][-+]?\d+)?$/;
var YAML_SEXAGESIMAL = /^[-+]?[0-9][0-9_]*(:[0-5]?[0-9])+(\.[0-9_]*)?$/;
/* YAML 1.1 also reads these as numbers, so a string that looks like one
   must be quoted or it comes back as the wrong type */
var YAML_SPECIAL_FLOAT = /^[-+]?(\.inf|\.Inf|\.INF|\.nan|\.NaN|\.NAN)$/;
var YAML_RADIX = /^[-+]?0(b[01_]+|x[0-9a-fA-F_]+|o?[0-7_]+)$/;
var YAML_INDICATOR = /^[-?:,\[\]{}#&*!|>'"%@`]/;

function yamlScalar(v) {
  if (v === null) return 'null';
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'number') {
    if (!isFinite(v)) return v > 0 ? '.inf' : (v < 0 ? '-.inf' : '.nan');
    return String(v);
  }

  var s = String(v);

  /* multi-line strings read far better as literal blocks, but only when
     every line is plain text — otherwise fall back to a quoted scalar */
  if (s.indexOf('\n') !== -1) return null;   /* caller emits a block */

  var needsQuote =
    s === '' ||
    YAML_RESERVED.test(s) ||
    YAML_NUMERIC.test(s) ||
    YAML_SEXAGESIMAL.test(s) ||
    YAML_SPECIAL_FLOAT.test(s) ||
    YAML_RADIX.test(s) ||
    YAML_INDICATOR.test(s) ||
    /: /.test(s) || /\s#/.test(s) ||
    /^\s|\s$/.test(s) ||
    /[\t\r\u0000-\u0008\u000b-\u001f\u007f]/.test(s);

  if (!needsQuote) return s;

  /* single quotes keep the text literal; double only when we must escape */
  if (!/[\\\t\r\u0000-\u0008\u000b-\u001f\u007f]/.test(s)) {
    return "'" + s.replace(/'/g, "''") + "'";
  }
  return JSON.stringify(s);
}

function toYaml(value, indent) {
  indent = indent || 0;
  var pad = '  '.repeat(indent);

  if (Array.isArray(value)) {
    if (!value.length) return pad + '[]\n';
    var out = '';
    for (var i = 0; i < value.length; i++) {
      var item = value[i];
      if (item !== null && typeof item === 'object') {
        var block = toYaml(item, indent + 1);
        /* hoist the first line onto the dash so the list reads naturally */
        out += pad + '-' + block.slice(pad.length + 2 - 1);
      } else {
        out += pad + '- ' + scalarOrBlock(item, indent + 1);
      }
    }
    return out;
  }

  if (value !== null && typeof value === 'object') {
    var keys = Object.keys(value);
    if (!keys.length) return pad + '{}\n';
    var res = '';
    for (var k = 0; k < keys.length; k++) {
      var key = keys[k], val = value[key];
      var kq = yamlScalar(key);
      if (kq === null) kq = JSON.stringify(key);   /* keys never become blocks */
      if (val !== null && typeof val === 'object' &&
          (Array.isArray(val) ? val.length : Object.keys(val).length)) {
        res += pad + kq + ':\n' + toYaml(val, indent + 1);
      } else if (val !== null && typeof val === 'object') {
        res += pad + kq + ': ' + (Array.isArray(val) ? '[]' : '{}') + '\n';
      } else {
        res += pad + kq + ': ' + scalarOrBlock(val, indent + 1);
      }
    }
    return res;
  }

  return pad + scalarOrBlock(value, indent);
}

/* returns the scalar plus its newline, or a literal block for multi-line text */
function scalarOrBlock(v, indent) {
  var q = yamlScalar(v);
  if (q !== null) return q + '\n';

  var pad = '  '.repeat(indent);
  var lines = String(v).split('\n');
  /* a trailing newline decides the chomping indicator */
  var chomp = '';
  if (lines[lines.length - 1] === '') { lines.pop(); }
  else { chomp = '-'; }
  var body = lines.map(function (l) { return l ? pad + l : ''; }).join('\n');
  return '|' + chomp + '\n' + body + '\n';
}

var SAMPLE = `{
  "service": "checkout-api",
  "version": "2.4.1",
  "region": "eu-central-1",
  "healthy": true,
  "replicas": 3,
  "lastDeploy": "2026-09-14T09:31:07Z",
  "endpoints": [
    {
      "path": "/v2/cart",
      "methods": ["GET", "POST", "DELETE"],
      "authRequired": true,
      "rateLimit": { "window": "1m", "max": 120, "burst": 40 },
      "p99Ms": 84
    },
    {
      "path": "/v2/checkout",
      "methods": ["POST"],
      "authRequired": true,
      "rateLimit": { "window": "1m", "max": 30, "burst": 5 },
      "p99Ms": 212
    },
    {
      "path": "/health",
      "methods": ["GET"],
      "authRequired": false,
      "rateLimit": null,
      "p99Ms": 3
    }
  ],
  "database": {
    "engine": "postgres",
    "version": "16.2",
    "pool": { "min": 4, "max": 32, "idleTimeoutMs": 30000 },
    "replicas": ["db-eu-1a", "db-eu-1b"],
    "migrations": { "applied": 147, "pending": 0 }
  },
  "features": {
    "applePay": true,
    "giftCards": true,
    "splitPayment": false,
    "guestCheckout": true
  },
  "notes": "Rate limits are per API key. The burst allowance refills at the window rate and is shared across all endpoints on the same key."
}`;

/* ==========================================================================
   Boot
   ========================================================================== */
var app = LintApp.init({
  id: 'json',
  label: 'JSON',
  parse: parse,
  stats: stats,
  /* JSON Lines with a broken line is not simply valid: the status leaves the word out */
  get okLabel() { return jsonl && jsonl.bad.length ? null : undefined; },
  adapter: adapter,
  highlighter: highlight,
  autoDepth: 2,
  emptyHTML: LintApp.emptyState({
    title: 'Paste JSON to see it as a tree',
    body: 'Expand it, search it and copy the path to any value.',
    extra: '<div class="empty-actions"><button class="bordered" data-empty="sample">Load a sample</button></div>'
  }),
  /* the editor is Compare's "before", so every edit re-runs the diff */
  onParsed: function (value) {
    docValue = value;
    /* a browser's HAR export reads better as requests: offered once a document */
    var isHar = !jsonl && value && typeof value === 'object' && value.log && Array.isArray(value.log.entries);
    if (!isHar) offeredHar = false;
    else if (!offeredHar && LintApp.openIn) {
      offeredHar = true;
      LintApp.toast('This is a HAR file: the requests a browser made', {
        label: 'Open in HAR viewer', href: '/har/',
        onFollow: function () {
          var chip = document.querySelector('.doc-name');
          var name = chip && chip.textContent.trim() ? chip.textContent.trim().replace(/\.json$/i, '') : 'network';
          LintApp.openIn(app.editor.getValue(), /\.har$/i.test(name) ? name : name + '.har', 'har');
        }
      });
    }
    /* JSON Lines that are a log read better in LOG: offered once a document */
    if (!jsonl) offeredLog = false;
    else if (!offeredLog && LintApp.jsonlKind && LintApp.jsonlKind(app.editor.getValue().slice(0, 65536)) === 'log') {
      offeredLog = true;
      LintApp.toast('These look like log lines', {
        label: 'Open in LOG viewer', href: '/log/',
        onFollow: function () { document.getElementById('btnToLog').click(); }
      });
    }
    /* a bad line in JSON Lines is marked and the rest still read */
    if (app.editor.setMarks) {
      var marks = {};
      if (jsonl) jsonl.bad.forEach(function (b) { marks[b.line] = { kind: 'err', title: 'Line ' + b.line + ': ' + b.message }; });
      app.editor.setMarks(marks);
    }
    if (cmp && cmp.comparing()) cmp.onEditorChanged();
  },
  /* a whole document pasted in lands formatted — unless it is JSON Lines,
     or was formatted already (any line starts indented), which is left as
     the writer laid it out */
  formatPaste: function (text) {
    if (text.length > 20e6 || /\n[ \t]+\S/.test(text)) return null;
    try { JSON.parse(text); } catch (e) { return null; }
    return reindent(text.trim());
  },
  sample: SAMPLE
});

/* Lays valid JSON out two spaces a level by moving whitespace alone: every
   number, string and key stays exactly as written. (Format rewrites from
   the parsed value, which turns 1.50 into 1.5 and rounds a 19-digit id;
   that is its job when asked, never on a paste.) */
function reindent(text) {
  var out = '', depth = 0, n = text.length;
  var at = function (d) { return '\n' + '  '.repeat(d); };
  for (var i = 0; i < n; i++) {
    var c = text[i];
    if (c === '"') {
      var j = i + 1;
      while (j < n && text[j] !== '"') j += text[j] === '\\' ? 2 : 1;
      out += text.slice(i, j + 1);
      i = j;
    } else if (c === ' ' || c === '\t' || c === '\n' || c === '\r') {
      continue;
    } else if (c === '{' || c === '[') {
      var k = i + 1;
      while (k < n && /\s/.test(text[k])) k++;
      if (text[k] === (c === '{' ? '}' : ']')) { out += c + text[k]; i = k; continue; }
      out += c + at(++depth);
    } else if (c === '}' || c === ']') {
      out += at(--depth) + c;
    } else if (c === ',') {
      out += ',' + at(depth);
    } else if (c === ':') {
      out += ': ';
    } else {
      out += c;
    }
  }
  return out;
}

document.getElementById('btnFormat').addEventListener('click', function () {
  var res = parse(app.editor.getValue());
  if (!res.ok) { app.run(); LintApp.toast('Fix the JSON before formatting'); return; }
  if (jsonl) {
    /* JSON Lines stays one record per line; formatting tidies each one */
    app.editor.setValue(jsonl.records.map(function (r) { return JSON.stringify(r); }).join('\n') + '\n');
    LintApp.toast(jsonl.bad.length ? 'Formatted; invalid lines were left out' : 'Formatted, one record per line');
    return;
  }
  app.editor.setValue(JSON.stringify(res.value, null, 2));
  LintApp.toast('Formatted');
});

document.getElementById('btnMinify').addEventListener('click', function () {
  var res = parse(app.editor.getValue());
  if (!res.ok) { app.run(); LintApp.toast('Fix the JSON before minifying'); return; }
  var before = app.editor.getValue().length;
  var out = jsonl ? jsonl.records.map(function (r) { return JSON.stringify(r); }).join('\n') + '\n' : JSON.stringify(res.value);
  app.editor.setValue(out);
  LintApp.toast('Minified — saved ' + LintApp.fmtBytes(Math.max(0, before - out.length)));
});

document.getElementById('btnEscape').addEventListener('click', function () {
  var raw = app.editor.getValue().trim();
  if (!raw) return;
  try {
    var unwrapped = JSON.parse(raw);
    if (typeof unwrapped !== 'string') {
      LintApp.toast('The editor already holds JSON, not an encoded string');
      return;
    }
    var inner = JSON.parse(unwrapped);
    app.editor.setValue(JSON.stringify(inner, null, 2));
    LintApp.toast('Unescaped');
  } catch (e) {
    LintApp.toast('That is not a JSON-encoded string');
  }
});


/* what Convert to offers for this document */
LintApp.when('btnToCsv', function () {
  return Array.isArray(docValue) && docValue.some(function (r) { return r && typeof r === 'object' && !Array.isArray(r); });
});
LintApp.when('btnToLines', function () { return Array.isArray(docValue) && !jsonl; });
LintApp.when('btnToArray', function () { return !!jsonl; });
LintApp.when('btnToLog', function () { return !!jsonl; });

/* ---------- JSON Lines and arrays, both ways ---------- */
document.getElementById('btnToArray').addEventListener('click', function () {
  var res = parse(app.editor.getValue());
  if (!jsonl) { LintApp.toast(res.ok ? 'This is already one JSON document' : 'Fix the JSON first'); return; }
  app.editor.setValue(JSON.stringify(jsonl.records, null, 2));
  LintApp.toast('Converted to a JSON array of ' + LintApp.fmtNum(res.value.length) + ' records');
});

document.getElementById('btnToLines').addEventListener('click', function () {
  var res = parse(app.editor.getValue());
  if (jsonl) { LintApp.toast('This is already JSON Lines'); return; }
  if (!res.ok || !Array.isArray(res.value)) { LintApp.toast('Only a JSON array can become JSON Lines'); return; }
  app.editor.setValue(res.value.map(function (r) { return JSON.stringify(r); }).join('\n') + '\n');
  LintApp.toast('Converted to JSON Lines: ' + LintApp.fmtNum(res.value.length) + ' lines');
});

/* records to a table: one column per key, in the order keys first appear;
   a nested value is written as JSON in its cell */
function toCsv(records) {
  var cols = [];
  records.forEach(function (r) { if (r && typeof r === 'object' && !Array.isArray(r)) Object.keys(r).forEach(function (k) { if (cols.indexOf(k) === -1) cols.push(k); }); });
  var cell = function (v) {
    if (v === undefined || v === null) return '';
    var t = typeof v === 'object' ? JSON.stringify(v) : String(v);
    return /[",\n\r]/.test(t) || t !== t.trim() ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  return [cols.map(cell).join(',')].concat(records.map(function (r) {
    return cols.map(function (c) { return cell(r && typeof r === 'object' ? r[c] : undefined); }).join(',');
  })).join('\n');
}

document.getElementById('btnToCsv').addEventListener('click', function () {
  var res = parse(app.editor.getValue());
  if (!res.ok || !Array.isArray(res.value) || !res.value.some(function (r) { return r && typeof r === 'object' && !Array.isArray(r); })) {
    LintApp.toast('CSV needs an array of records, or JSON Lines'); return;
  }
  LintApp.copyAndOffer(toCsv(res.value), 'CSV', 'json', 'csv');
});

document.getElementById('btnToLog').addEventListener('click', function () {
  var text = app.editor.getValue();
  if (!text.trim()) return;
  var chip = document.querySelector('.doc-name');
  var name = chip && /\.(jsonl|ndjson|log)$/i.test(chip.textContent.trim()) ? chip.textContent.trim() : 'records.jsonl';
  LintApp.openIn(text, name, 'log');
});

document.getElementById('btnToYaml').addEventListener('click', function () {
  var res = parse(app.editor.getValue());
  if (!res.ok) { app.run(); LintApp.toast('Fix the JSON before converting'); return; }
  LintApp.copyAndOffer(toYaml(res.value), 'YAML', 'json', 'yaml');
});

/* ---------- Compare: the shared diff, over this tool's parse ---------- */
var cmp = LintCompare.mount({ app: app, parse: parse, label: 'JSON' });

})();
