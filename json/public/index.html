<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON Viewer & Formatter · lint.uz</title>
<meta name="description" content="A fast, private JSON viewer, formatter, validator and minifier. Everything runs in your browser — your data never leaves the page.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/app.css">
</head>
<body>
<div class="app" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
window.LINT_CONFIG = {
  id: 'json',
  name: 'JSON Viewer',
  host: 'json.lint.uz',
  label: 'JSON',
  mark: '{}',
  hue: '#4F46E5',
  hueInk: '#FFFFFF',
  accept: '.json,.jsonc,.txt,application/json',
  placeholder: 'Paste JSON, drop a file, or press Sample…',
  searchPlaceholder: 'Search keys and values…',
  actions: [
    { id: 'btnFormat', label: 'Format', primary: true, title: 'Pretty-print with 2-space indent (⌘↵)' },
    { id: 'btnMinify', label: 'Minify', title: 'Strip all whitespace' },
    { id: 'btnEscape', label: 'Unescape', hide: 'md', title: 'Parse a JSON-encoded string into real JSON' }
  ]
};
</script>
<script src="shared/theme-boot.js"></script>
<script src="shared/shell.js"></script>
<script src="shared/app.js"></script>
<script>
(function () {
'use strict';

var esc = LintApp.esc;

/* ==========================================================================
   Syntax highlighting
   One regex pass over the source; everything not matched is escaped text.
   ========================================================================== */
var TOKEN = /("(?:[^"\\]|\\.)*"\s*:)|("(?:[^"\\]|\\.)*")|(-?\d+\.?\d*(?:[eE][+-]?\d+)?)|(\btrue\b|\bfalse\b)|(\bnull\b)|([{}\[\],:])/g;

function highlight(text) {
  var out = '', last = 0, m;
  TOKEN.lastIndex = 0;
  while ((m = TOKEN.exec(text)) !== null) {
    if (m.index > last) out += esc(text.slice(last, m.index));
    var cls = m[1] ? 'hl-key' : m[2] ? 'hl-str' : m[3] ? 'hl-num'
            : m[4] ? 'hl-bool' : m[5] ? 'hl-null' : 'hl-punct';
    out += '<span class="' + cls + '">' + esc(m[0]) + '</span>';
    last = m.index + m[0].length;
  }
  out += esc(text.slice(last));
  return out;
}

/* ==========================================================================
   Parsing
   JSON.parse gives a character offset but no line/column — derive them so
   the gutter can mark the bad line.
   ========================================================================== */
function parse(text) {
  try {
    return { ok: true, value: JSON.parse(text) };
  } catch (e) {
    var msg = e.message || 'Invalid JSON';
    var pos = null;

    var mPos = msg.match(/position (\d+)/i);
    if (mPos) pos = parseInt(mPos[1], 10);

    var line = null, col = null;
    var mLine = msg.match(/line (\d+) column (\d+)/i);
    if (mLine) {
      line = parseInt(mLine[1], 10);
      col = parseInt(mLine[2], 10);
    } else if (pos !== null) {
      var before = text.slice(0, pos).split('\n');
      line = before.length;
      col = before[before.length - 1].length + 1;
    }

    /* strip the engine's own position suffix — we render it separately */
    msg = msg
      .replace(/^JSON\.parse:\s*/, '')
      .replace(/\s*(?:in JSON )?at position \d+.*$/i, '')
      .replace(/\s*at line \d+ column \d+.*$/i, '');

    return { ok: false, message: msg, pos: pos, line: line, col: col };
  }
}

function typeOf(v) {
  if (v === null) return 'null';
  if (Array.isArray(v)) return 'array';
  return typeof v;
}

function sizeOf(v) {
  if (!v || typeof v !== 'object') return 0;
  return Array.isArray(v) ? v.length : Object.keys(v).length;
}

function stats(value) {
  var nodes = 0, depth = 0;
  (function walk(v, d) {
    nodes++;
    if (d > depth) depth = d;
    if (v && typeof v === 'object') {
      if (Array.isArray(v)) for (var i = 0; i < v.length; i++) walk(v[i], d + 1);
      else for (var k in v) walk(v[k], d + 1);
    }
  })(value, 1);
  return LintApp.fmtNum(nodes) + ' nodes · depth ' + depth;
}

/* ==========================================================================
   Tree adapter
   ========================================================================== */
var IDENT = /^[A-Za-z_$][A-Za-z0-9_$]*$/;

function pathString(path) {
  var s = '$';
  for (var i = 0; i < path.length; i++) {
    var seg = path[i];
    if (typeof seg === 'number') s += '[' + seg + ']';
    else if (IDENT.test(seg)) s += '.' + seg;
    else s += '[' + JSON.stringify(seg) + ']';
  }
  return s;
}

var TICON = {
  object: ['obj', '{}'], array: ['arr', '[]'], string: ['str', 'ab'],
  number: ['num', '#'], boolean: ['bool', '◑'], null: ['null', '∅']
};

var adapter = {
  pathLabel: 'Path',

  rootEntry: function (value) { return { key: undefined, value: value, path: [] }; },

  children: function (e) {
    var v = e.value;
    if (!v || typeof v !== 'object') return [];
    var out = [];
    if (Array.isArray(v)) {
      for (var i = 0; i < v.length; i++) out.push({ key: i, value: v[i], path: e.path.concat([i]) });
    } else {
      var keys = Object.keys(v);
      for (var j = 0; j < keys.length; j++) {
        out.push({ key: keys[j], value: v[keys[j]], path: e.path.concat([keys[j]]) });
      }
    }
    return out;
  },

  childCount: function (e) { return sizeOf(e.value); },

  matches: function (e, q) {
    if (typeof e.key === 'string' && e.key.toLowerCase().indexOf(q) !== -1) return true;
    var t = typeOf(e.value);
    if (t === 'object' || t === 'array') return false;
    return String(e.value).toLowerCase().indexOf(q) !== -1;
  },

  path: function (e) { return pathString(e.path); },

  decorate: function (row, e, q, util) {
    var t = typeOf(e.value);
    var spec = TICON[t] || TICON.object;

    var icon = document.createElement('span');
    icon.className = 'ticon t-' + spec[0];
    icon.textContent = t === 'boolean' ? (e.value ? '✓' : '✕') : spec[1];
    icon.title = t;
    row.appendChild(icon);

    if (e.key !== undefined) {
      var k = document.createElement('span');
      k.className = 'k' + (typeof e.key === 'number' ? ' idx' : '');
      util.highlightInto(k, typeof e.key === 'number' ? '[' + e.key + ']' : String(e.key), q);
      row.appendChild(k);
      var colon = document.createElement('span');
      colon.className = 'colon';
      colon.textContent = ':';
      row.appendChild(colon);
    }

    if (t === 'object' || t === 'array') {
      var n = sizeOf(e.value);
      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = t === 'array' ? (n ? '[ … ]' : '[ ]') : (n ? '{ … }' : '{ }');
      if (n) {
        var cnt = document.createElement('span');
        cnt.className = 'cnt';
        cnt.textContent = n + (t === 'array'
          ? (n === 1 ? ' item' : ' items')
          : (n === 1 ? ' key' : ' keys'));
        badge.appendChild(cnt);
      }
      row.appendChild(badge);
    } else {
      var v = document.createElement('span');
      v.className = 'v ' + (t === 'boolean' ? 'bool' : t === 'string' ? 'str' : t);
      if (t === 'string' && e.value.length > util.STR_TRUNC) {
        var full = e.value;
        util.highlightInto(v, full.slice(0, util.STR_TRUNC) + '…', q);
        var more = document.createElement('button');
        more.className = 'trunc-btn';
        more.textContent = '+' + LintApp.fmtNum(full.length - util.STR_TRUNC) + ' chars';
        more.title = 'Show the whole string';
        more.addEventListener('click', function (ev) {
          ev.stopPropagation();
          v.textContent = '';
          util.highlightInto(v, full, q);
        });
        v.appendChild(more);
      } else {
        util.highlightInto(v, String(e.value), q);
      }
      row.appendChild(v);
    }
  },

  actions: function (e) {
    return [
      { label: 'path', title: 'Copy the path to this node', toastLabel: 'Path',
        get: function () { return pathString(e.path); } },
      { label: 'value', title: 'Copy this value as JSON', toastLabel: 'Value',
        get: function () { return JSON.stringify(e.value, null, 2); } }
    ];
  }
};

var SAMPLE = `{
  "service": "checkout-api",
  "version": "2.4.1",
  "region": "eu-central-1",
  "healthy": true,
  "replicas": 3,
  "lastDeploy": "2026-09-14T09:31:07Z",
  "endpoints": [
    {
      "path": "/v2/cart",
      "methods": ["GET", "POST", "DELETE"],
      "authRequired": true,
      "rateLimit": { "window": "1m", "max": 120, "burst": 40 },
      "p99Ms": 84
    },
    {
      "path": "/v2/checkout",
      "methods": ["POST"],
      "authRequired": true,
      "rateLimit": { "window": "1m", "max": 30, "burst": 5 },
      "p99Ms": 212
    },
    {
      "path": "/health",
      "methods": ["GET"],
      "authRequired": false,
      "rateLimit": null,
      "p99Ms": 3
    }
  ],
  "database": {
    "engine": "postgres",
    "version": "16.2",
    "pool": { "min": 4, "max": 32, "idleTimeoutMs": 30000 },
    "replicas": ["db-eu-1a", "db-eu-1b"],
    "migrations": { "applied": 147, "pending": 0 }
  },
  "features": {
    "applePay": true,
    "giftCards": true,
    "splitPayment": false,
    "guestCheckout": true
  },
  "notes": "Rate limits are per API key. The burst allowance refills at the window rate and is shared across all endpoints on the same key."
}`;

/* ==========================================================================
   Boot
   ========================================================================== */
var app = LintApp.init({
  id: 'json',
  label: 'JSON',
  parse: parse,
  stats: stats,
  adapter: adapter,
  highlighter: highlight,
  autoDepth: 2,
  emptyHTML:
    '<div class="empty">Valid JSON in the editor appears here as a tree you can ' +
    'expand, search and copy paths from.<br><br>' +
    'Press <kbd>⌘K</kbd> for the editor, <kbd>⌘F</kbd> to search, ' +
    '<kbd>⌘↵</kbd> to format.</div>',
  sample: SAMPLE
});

document.getElementById('btnFormat').addEventListener('click', function () {
  var res = parse(app.editor.getValue());
  if (!res.ok) { app.run(); LintApp.toast('Fix the JSON before formatting'); return; }
  app.editor.setValue(JSON.stringify(res.value, null, 2));
  LintApp.toast('Formatted');
});

document.getElementById('btnMinify').addEventListener('click', function () {
  var res = parse(app.editor.getValue());
  if (!res.ok) { app.run(); LintApp.toast('Fix the JSON before minifying'); return; }
  var before = app.editor.getValue().length;
  var out = JSON.stringify(res.value);
  app.editor.setValue(out);
  LintApp.toast('Minified — saved ' + LintApp.fmtBytes(Math.max(0, before - out.length)));
});

document.getElementById('btnEscape').addEventListener('click', function () {
  var raw = app.editor.getValue().trim();
  if (!raw) return;
  try {
    var unwrapped = JSON.parse(raw);
    if (typeof unwrapped !== 'string') {
      LintApp.toast('The editor already holds JSON, not an encoded string');
      return;
    }
    var inner = JSON.parse(unwrapped);
    app.editor.setValue(JSON.stringify(inner, null, 2));
    LintApp.toast('Unescaped');
  } catch (e) {
    LintApp.toast('That is not a JSON-encoded string');
  }
});

})();
</script>
</body>
</html>
