<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XML Viewer & Formatter · lint.uz</title>
<meta name="description" content="A fast, private XML viewer, formatter, validator and XPath explorer. Everything runs in your browser — your data never leaves the page.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/app.css">
</head>
<body>
<div class="app" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
window.LINT_CONFIG = {
  id: 'xml',
  name: 'XML Viewer',
  host: 'xml.lint.uz',
  label: 'XML',
  mark: '&lt;&gt;',
  hue: '#0F766E',
  hueInk: '#FFFFFF',
  accept: '.xml,.xsd,.xsl,.svg,.rss,.atom,.txt,text/xml,application/xml',
  placeholder: 'Paste XML, drop a file, or press Sample…',
  searchPlaceholder: 'Search elements, attributes and text…',
  actions: [
    { id: 'btnFormat', label: 'Format', primary: true, title: 'Pretty-print with 2-space indent (⌘↵)' },
    { id: 'btnMinify', label: 'Minify', title: 'Strip whitespace between tags' },
    { id: 'btnToJson', label: 'To JSON', hide: 'md', title: 'Copy this document as JSON' }
  ]
};
</script>
<script src="shared/theme-boot.js"></script>
<script src="shared/shell.js"></script>
<script src="shared/app.js"></script>
<script>
(function () {
'use strict';

var esc = LintApp.esc;

/* ==========================================================================
   Syntax highlighting
   ========================================================================== */
var TOKEN = /(<!--[\s\S]*?-->)|(<!\[CDATA\[[\s\S]*?\]\]>)|(<\?[\s\S]*?\?>)|(<!DOCTYPE[^>]*>)|(<\/?)([A-Za-z_][\w.:-]*)((?:\s+[\w.:-]+\s*=\s*(?:"[^"]*"|'[^']*'))*)\s*(\/?>)/g;
var ATTR = /([\w.:-]+)(\s*=\s*)("[^"]*"|'[^']*')/g;

function highlightAttrs(s) {
  var out = '', last = 0, m;
  ATTR.lastIndex = 0;
  while ((m = ATTR.exec(s)) !== null) {
    if (m.index > last) out += esc(s.slice(last, m.index));
    out += '<span class="hl-attr">' + esc(m[1]) + '</span>' +
           '<span class="hl-punct">' + esc(m[2]) + '</span>' +
           '<span class="hl-str">' + esc(m[3]) + '</span>';
    last = m.index + m[0].length;
  }
  out += esc(s.slice(last));
  return out;
}

function highlight(text) {
  var out = '', last = 0, m;
  TOKEN.lastIndex = 0;
  while ((m = TOKEN.exec(text)) !== null) {
    if (m.index > last) out += esc(text.slice(last, m.index));
    if (m[1]) out += '<span class="hl-cmt">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="hl-str">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="hl-doc">' + esc(m[3]) + '</span>';
    else if (m[4]) out += '<span class="hl-doc">' + esc(m[4]) + '</span>';
    else {
      out += '<span class="hl-punct">' + esc(m[5]) + '</span>' +
             '<span class="hl-tag">' + esc(m[6]) + '</span>' +
             highlightAttrs(m[7] || '') +
             '<span class="hl-punct">' + esc(m[8]) + '</span>';
    }
    last = m.index + m[0].length;
  }
  out += esc(text.slice(last));
  return out;
}

/* ==========================================================================
   Parsing
   DOMParser reports failures as a parsererror document rather than throwing,
   and the wording differs per engine — normalise it into one shape.
   ========================================================================== */
function parse(text) {
  var doc;
  try {
    doc = new DOMParser().parseFromString(text, 'application/xml');
  } catch (e) {
    return { ok: false, message: 'Could not parse this document', pos: null };
  }

  var err = doc.querySelector('parsererror');
  if (!err) return { ok: true, value: doc };

  var raw = (err.textContent || 'Invalid XML').trim();
  var line = null, col = null;

  var m = raw.match(/line[:\s]+(\d+)/i);
  if (m) line = parseInt(m[1], 10);
  var c = raw.match(/column[:\s]+(\d+)/i);
  if (c) col = parseInt(c[1], 10);

  /* take the most informative single line, minus the engine's boilerplate */
  var msg = raw.split('\n')
    .map(function (s) { return s.trim(); })
    .filter(function (s) {
      return s && !/^This page contains/i.test(s) && !/^-+\^?$/.test(s);
    })[0] || 'Invalid XML';
  msg = msg
    .replace(/^error on line \d+ at column \d+:\s*/i, '')
    .replace(/\s*Below is a rendering.*$/i, '');

  var pos = null;
  if (line) {
    var lines = text.split('\n');
    pos = 0;
    for (var i = 0; i < line - 1 && i < lines.length; i++) pos += lines[i].length + 1;
    pos += Math.max(0, (col || 1) - 1);
  }

  return { ok: false, message: msg, pos: pos, line: line, col: col };
}

function stats(doc) {
  var els = doc.getElementsByTagName('*');
  var attrs = 0, depth = 0;
  for (var i = 0; i < els.length; i++) {
    attrs += els[i].attributes.length;
    var d = 0, n = els[i];
    while (n.parentNode && n.parentNode.nodeType === 1) { d++; n = n.parentNode; }
    if (d > depth) depth = d;
  }
  return LintApp.fmtNum(els.length) + ' elements · ' +
         LintApp.fmtNum(attrs) + ' attributes · depth ' + (depth + 1);
}

/* ==========================================================================
   XPath
   ========================================================================== */
function xpathOf(node) {
  if (!node || node.nodeType === 9) return '';
  if (node.nodeType === 2) return xpathOf(node.ownerElement) + '/@' + node.nodeName;
  if (node.nodeType === 3) return xpathOf(node.parentNode) + '/text()';
  if (node.nodeType === 8) return xpathOf(node.parentNode) + '/comment()';
  if (node.nodeType === 4) return xpathOf(node.parentNode) + '/text()';

  var parent = node.parentNode;
  if (!parent || parent.nodeType === 9) return '/' + node.nodeName;

  var same = 0, index = 0;
  for (var i = 0; i < parent.children.length; i++) {
    var sib = parent.children[i];
    if (sib.nodeName === node.nodeName) {
      same++;
      if (sib === node) index = same;
    }
  }
  return xpathOf(parent) + '/' + node.nodeName + (same > 1 ? '[' + index + ']' : '');
}

/* Meaningful children only: elements, attributes, comments, and text that
   is not pure inter-tag indentation. */
function childEntries(node) {
  var out = [];
  if (node.nodeType !== 1 && node.nodeType !== 9) return out;

  if (node.nodeType === 1) {
    for (var a = 0; a < node.attributes.length; a++) {
      out.push({ node: node.attributes[a], kind: 'attr' });
    }
  }
  for (var i = 0; i < node.childNodes.length; i++) {
    var c = node.childNodes[i];
    if (c.nodeType === 1) out.push({ node: c, kind: 'el' });
    else if (c.nodeType === 8) out.push({ node: c, kind: 'cmt' });
    else if ((c.nodeType === 3 || c.nodeType === 4) && c.nodeValue.trim()) {
      out.push({ node: c, kind: 'text' });
    }
  }
  return out;
}

var adapter = {
  pathLabel: 'XPath',

  rootEntry: function (doc) {
    return { node: doc.documentElement, kind: 'el' };
  },

  children: function (e) {
    if (e.kind !== 'el') return [];
    var kids = childEntries(e.node);
    /* an element wrapping only text renders that text on its own row,
       so it must not also appear as a child */
    if (isTextOnly(kids)) return kids.filter(function (k) { return k.kind !== 'text'; });
    return kids;
  },

  childCount: function (e) {
    return e.kind === 'el' ? adapter.children(e).length : 0;
  },

  matches: function (e, q) {
    var n = e.node;
    if (e.kind === 'el') return n.nodeName.toLowerCase().indexOf(q) !== -1;
    if (e.kind === 'attr') {
      return n.nodeName.toLowerCase().indexOf(q) !== -1 ||
             String(n.value).toLowerCase().indexOf(q) !== -1;
    }
    return String(n.nodeValue).toLowerCase().indexOf(q) !== -1;
  },

  path: function (e) { return xpathOf(e.node); },

  decorate: function (row, e, q, util) {
    var n = e.node;

    if (e.kind === 'attr') {
      addIcon(row, 't-attr', '@', 'attribute');
      var ak = document.createElement('span');
      ak.className = 'k';
      util.highlightInto(ak, n.nodeName, q);
      row.appendChild(ak);
      row.appendChild(sep('='));
      var av = document.createElement('span');
      av.className = 'v str';
      util.highlightInto(av, '"' + n.value + '"', q);
      row.appendChild(av);
      return;
    }

    if (e.kind === 'text') {
      addIcon(row, 't-text', 'ab', 'text');
      appendValue(row, n.nodeValue.trim(), q, util);
      return;
    }

    if (e.kind === 'cmt') {
      addIcon(row, 't-cmt', '//', 'comment');
      var cm = document.createElement('span');
      cm.className = 'v null';
      util.highlightInto(cm, n.nodeValue.trim(), q);
      row.appendChild(cm);
      return;
    }

    /* element */
    addIcon(row, 't-obj', '<>', 'element');
    var k = document.createElement('span');
    k.className = 'k';
    util.highlightInto(k, n.nodeName, q);
    row.appendChild(k);

    /* an element wrapping only text shows that text inline */
    var kids = childEntries(n);
    if (isTextOnly(kids)) {
      row.appendChild(sep(':'));
      var textNode = kids.filter(function (k) { return k.kind === 'text'; })[0];
      appendValue(row, textNode.node.nodeValue.trim(), q, util);
      return;
    }

    var elCount = 0, attrCount = n.attributes ? n.attributes.length : 0;
    for (var i = 0; i < kids.length; i++) if (kids[i].kind === 'el') elCount++;
    if (elCount || attrCount) {
      var badge = document.createElement('span');
      badge.className = 'badge';
      var cnt = document.createElement('span');
      cnt.className = 'cnt';
      var parts = [];
      if (elCount) parts.push(elCount + (elCount === 1 ? ' child' : ' children'));
      if (attrCount) parts.push(attrCount + (attrCount === 1 ? ' attr' : ' attrs'));
      cnt.textContent = parts.join(' · ');
      badge.appendChild(cnt);
      row.appendChild(badge);
    }
  },

  actions: function (e) {
    return [
      { label: 'xpath', title: 'Copy the XPath to this node', toastLabel: 'XPath',
        get: function () { return xpathOf(e.node); } },
      { label: 'xml', title: 'Copy this node as XML', toastLabel: 'XML',
        get: function () {
          if (e.kind === 'attr') return e.node.nodeName + '="' + e.node.value + '"';
          if (e.kind === 'el') return new XMLSerializer().serializeToString(e.node);
          return e.node.nodeValue;
        } }
    ];
  }
};

/* text-only = exactly one child and it is text (attributes don't count,
   they are listed separately) */
function isTextOnly(kids) {
  var els = 0, texts = 0;
  for (var i = 0; i < kids.length; i++) {
    if (kids[i].kind === 'el' || kids[i].kind === 'cmt') els++;
    else if (kids[i].kind === 'text') texts++;
  }
  return texts === 1 && els === 0;
}

function addIcon(row, cls, glyph, title) {
  var i = document.createElement('span');
  i.className = 'ticon ' + cls;
  i.textContent = glyph;
  i.title = title;
  row.appendChild(i);
}

function sep(ch) {
  var s = document.createElement('span');
  s.className = 'colon';
  s.textContent = ch;
  return s;
}

function appendValue(row, text, q, util) {
  var v = document.createElement('span');
  v.className = 'v str';
  if (text.length > util.STR_TRUNC) {
    var full = text;
    util.highlightInto(v, full.slice(0, util.STR_TRUNC) + '…', q);
    var more = document.createElement('button');
    more.className = 'trunc-btn';
    more.textContent = '+' + LintApp.fmtNum(full.length - util.STR_TRUNC) + ' chars';
    more.addEventListener('click', function (ev) {
      ev.stopPropagation();
      v.textContent = '';
      util.highlightInto(v, full, q);
    });
    v.appendChild(more);
  } else {
    util.highlightInto(v, text, q);
  }
  row.appendChild(v);
}

/* ==========================================================================
   Format / minify / convert
   ========================================================================== */
function formatXml(text) {
  var out = '', indent = 0;
  /* split so every tag sits on its own line, keeping text with its element */
  var tokens = text.replace(/>\s*</g, '><').split(/(<[^>]*>)/g)
    .filter(function (t) { return t.trim(); });

  for (var i = 0; i < tokens.length; i++) {
    var t = tokens[i].trim();
    if (!t) continue;

    if (/^<\/.+>$/.test(t)) {
      indent = Math.max(0, indent - 1);
      out += '  '.repeat(indent) + t + '\n';
    } else if (/^<[^!?][^>]*[^\/]>$/.test(t) || /^<[a-zA-Z_][\w.:-]*>$/.test(t)) {
      /* opening tag — if the next token is text and the one after is its
         closing tag, keep all three on one line */
      var next = tokens[i + 1], after = tokens[i + 2];
      if (next && !/^</.test(next.trim()) && after && /^<\/.+>$/.test(after.trim())) {
        out += '  '.repeat(indent) + t + next.trim() + after.trim() + '\n';
        i += 2;
      } else {
        out += '  '.repeat(indent) + t + '\n';
        indent++;
      }
    } else if (/^<.*\/>$/.test(t) || /^<[!?]/.test(t)) {
      out += '  '.repeat(indent) + t + '\n';
    } else {
      out += '  '.repeat(indent) + t + '\n';
    }
  }
  return out.trim();
}

function xmlToJson(node) {
  if (node.nodeType === 3 || node.nodeType === 4) return node.nodeValue.trim();

  var obj = {};
  if (node.attributes) {
    for (var a = 0; a < node.attributes.length; a++) {
      obj['@' + node.attributes[a].nodeName] = node.attributes[a].value;
    }
  }

  var kids = [];
  for (var i = 0; i < node.childNodes.length; i++) {
    var c = node.childNodes[i];
    if (c.nodeType === 1) kids.push(c);
    else if ((c.nodeType === 3 || c.nodeType === 4) && c.nodeValue.trim()) {
      kids.push(c);
    }
  }

  var textOnly = kids.length === 1 && kids[0].nodeType !== 1;
  if (textOnly && !Object.keys(obj).length) return kids[0].nodeValue.trim();
  if (textOnly) { obj['#text'] = kids[0].nodeValue.trim(); return obj; }

  for (var j = 0; j < kids.length; j++) {
    var k = kids[j];
    if (k.nodeType !== 1) continue;
    var name = k.nodeName;
    var val = xmlToJson(k);
    if (obj[name] === undefined) obj[name] = val;
    else if (Array.isArray(obj[name])) obj[name].push(val);
    else obj[name] = [obj[name], val];
  }
  return obj;
}

var SAMPLE = `<?xml version="1.0" encoding="UTF-8"?>
<!-- Release feed for the checkout service -->
<catalog xmlns:ops="https://lint.uz/ns/ops" updated="2026-09-14T09:31:07Z">
  <service id="checkout-api" region="eu-central-1">
    <name>Checkout API</name>
    <version>2.4.1</version>
    <healthy>true</healthy>
    <ops:owner team="payments" oncall="rota-b"/>
    <endpoints count="3">
      <endpoint method="GET" auth="required">
        <path>/v2/cart</path>
        <rateLimit window="1m" max="120" burst="40"/>
        <p99 unit="ms">84</p99>
      </endpoint>
      <endpoint method="POST" auth="required">
        <path>/v2/checkout</path>
        <rateLimit window="1m" max="30" burst="5"/>
        <p99 unit="ms">212</p99>
      </endpoint>
      <endpoint method="GET" auth="none">
        <path>/health</path>
        <p99 unit="ms">3</p99>
      </endpoint>
    </endpoints>
    <database engine="postgres" version="16.2">
      <pool min="4" max="32" idleTimeoutMs="30000"/>
      <replica>db-eu-1a</replica>
      <replica>db-eu-1b</replica>
    </database>
    <notes><![CDATA[Rate limits are per API key & shared across endpoints.]]></notes>
  </service>
</catalog>`;

/* ==========================================================================
   Boot
   ========================================================================== */
var app = LintApp.init({
  id: 'xml',
  label: 'XML',
  parse: parse,
  stats: stats,
  adapter: adapter,
  highlighter: highlight,
  autoDepth: 3,
  emptyHTML:
    '<div class="empty">Valid XML in the editor appears here as a tree of ' +
    'elements, attributes and text — click any node to copy its XPath.<br><br>' +
    'Press <kbd>⌘K</kbd> for the editor, <kbd>⌘F</kbd> to search, ' +
    '<kbd>⌘↵</kbd> to format.</div>',
  sample: SAMPLE
});

document.getElementById('btnFormat').addEventListener('click', function () {
  var res = parse(app.editor.getValue());
  if (!res.ok) { app.run(); LintApp.toast('Fix the XML before formatting'); return; }
  app.editor.setValue(formatXml(app.editor.getValue()));
  LintApp.toast('Formatted');
});

document.getElementById('btnMinify').addEventListener('click', function () {
  var res = parse(app.editor.getValue());
  if (!res.ok) { app.run(); LintApp.toast('Fix the XML before minifying'); return; }
  var before = app.editor.getValue().length;
  var out = app.editor.getValue().replace(/>\s+</g, '><').trim();
  app.editor.setValue(out);
  LintApp.toast('Minified — saved ' + LintApp.fmtBytes(Math.max(0, before - out.length)));
});

document.getElementById('btnToJson').addEventListener('click', function () {
  var res = parse(app.editor.getValue());
  if (!res.ok) { app.run(); LintApp.toast('Fix the XML before converting'); return; }
  var root = res.value.documentElement;
  var wrapper = {};
  wrapper[root.nodeName] = xmlToJson(root);
  LintApp.copy(JSON.stringify(wrapper, null, 2), 'JSON');
});
})();
</script>
</body>
</html>
