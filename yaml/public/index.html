<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAML Viewer & Formatter · lint.one</title>
<meta name="description" content="A fast, private YAML viewer, formatter, validator and YAML ↔ JSON converter. Everything runs in your browser — your data never leaves the page.">
<meta name="color-scheme" content="light dark">
<!-- the pages carry their own light and dark themes; Dark Reader would
     repaint them on top and lose the format colours and glyphs -->
<meta name="darkreader-lock">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/app.css">
</head>
<body>
<div class="app" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="js-yaml.min.js"></script>
<script>
window.LINT_CONFIG = {
  id: 'yaml',
  name: 'YAML',
  host: 'lint.one/yaml',
  label: 'YAML',
  emptyLine: 'You\'ll get indentation checked, and multi-document files as a list.',
  hue: '#B45309',
  hueInk: '#FFFFFF',
  accept: '.yaml,.yml,.txt,text/yaml,application/x-yaml',
  placeholder: 'Paste YAML or drop a file…',
  searchPlaceholder: 'Search keys and values…',
  actions: [
    { id: 'btnFormat', label: 'Format', primary: true, key: 'shift+alt+f', title: 'Rewrite the document with a consistent two-space indent' },
    { id: 'btnToYaml', label: 'From JSON', title: 'Replace JSON in the editor with the same data written as YAML' },
    { id: 'btnToJson', label: 'To JSON', hide: 'md', key: 'mod+shift+j', title: 'Copy this document as JSON, ready to open in the JSON viewer' }
  ]
};
</script>
<script src="/shared/theme-boot.js"></script>
<script src="/shared/shell.js"></script>
<script src="/shared/app.js"></script>
<script>
(function () {
'use strict';

var esc = LintApp.esc;

/* ==========================================================================
   Syntax highlighting
   Line-oriented, because YAML's meaning comes from line structure.
   ========================================================================== */
function highlight(text) {
  var lines = text.split('\n');
  var out = [];

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];

    /* document markers */
    if (/^\s*(---|\.\.\.)\s*$/.test(line)) {
      out.push('<span class="hl-doc">' + esc(line) + '</span>');
      continue;
    }

    /* whole-line comment */
    var cm = line.match(/^(\s*)(#.*)$/);
    if (cm) {
      out.push(esc(cm[1]) + '<span class="hl-cmt">' + esc(cm[2]) + '</span>');
      continue;
    }

    /* split off a trailing comment that is not inside quotes */
    var body = line, trail = '';
    var q = null;
    for (var c = 0; c < line.length; c++) {
      var ch = line[c];
      if (q) { if (ch === q && line[c - 1] !== '\\') q = null; }
      else if (ch === '"' || ch === "'") q = ch;
      else if (ch === '#' && c > 0 && /\s/.test(line[c - 1])) {
        body = line.slice(0, c);
        trail = line.slice(c);
        break;
      }
    }

    out.push(highlightBody(body) +
      (trail ? '<span class="hl-cmt">' + esc(trail) + '</span>' : ''));
  }
  return out.join('\n');
}

function highlightBody(s) {
  /* leading indent + optional sequence dash */
  var m = s.match(/^(\s*)(-\s+|-$)?([\s\S]*)$/);
  var indent = m[1] || '';
  var dash = m[2] || '';
  var rest = m[3] || '';

  var head = esc(indent) +
    (dash ? '<span class="hl-punct">' + esc(dash) + '</span>' : '');

  /* key: value */
  var kv = rest.match(/^("(?:[^"\\]|\\.)*"|'(?:[^']|'')*'|[^:\s][^:]*?)(\s*:)(\s*)([\s\S]*)$/);
  if (kv) {
    return head +
      '<span class="hl-key">' + esc(kv[1]) + '</span>' +
      '<span class="hl-punct">' + esc(kv[2]) + '</span>' +
      esc(kv[3]) +
      highlightScalar(kv[4]);
  }
  return head + highlightScalar(rest);
}

function highlightScalar(v) {
  if (!v) return '';
  var t = v.trim();
  if (!t) return esc(v);

  /* anchors, aliases and tags keep their own colour */
  var anchor = v.match(/^(\s*)([&*][\w.-]+|![\w!/.-]*)(\s*)([\s\S]*)$/);
  if (anchor) {
    return esc(anchor[1]) +
      '<span class="hl-anchor">' + esc(anchor[2]) + '</span>' +
      esc(anchor[3]) + highlightScalar(anchor[4]);
  }

  var cls;
  if (/^("(?:[^"\\]|\\.)*"|'(?:[^']|'')*')$/.test(t)) cls = 'hl-str';
  else if (/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(t) || /^0[xob][\da-fA-F]+$/.test(t)) cls = 'hl-num';
  else if (/^(true|false|yes|no|on|off)$/i.test(t)) cls = 'hl-bool';
  else if (/^(null|~)$/i.test(t)) cls = 'hl-null';
  else if (/^[[\]{}]/.test(t)) cls = 'hl-punct';
  else if (/^[|>][-+\d]*$/.test(t)) cls = 'hl-doc';
  else return esc(v);

  var lead = v.match(/^\s*/)[0];
  var tail = v.slice(lead.length + t.length);
  return esc(lead) + '<span class="' + cls + '">' + esc(t) + '</span>' + esc(tail);
}

/* ==========================================================================
   Parsing
   Multi-document YAML is common (Kubernetes manifests), so load every
   document and present a list when there is more than one.
   ========================================================================== */
function parse(text) {
  try {
    var docs = jsyaml.loadAll(text);
    var value = docs.length === 1 ? docs[0] : docs;
    return { ok: true, value: value, multi: docs.length > 1, count: docs.length };
  } catch (e) {
    var line = null, col = null, pos = null;
    if (e.mark) {
      line = e.mark.line + 1;
      col = e.mark.column + 1;
      pos = e.mark.position;
    }
    var message = e.reason || (e.message ? e.message.split('\n')[0] : 'Invalid YAML');
    return { ok: false, message: message, pos: pos, line: line, col: col };
  }
}

function typeOf(v) {
  if (v === null || v === undefined) return 'null';
  if (v instanceof Date) return 'date';
  if (Array.isArray(v)) return 'array';
  return typeof v;
}

function sizeOf(v) {
  if (!v || typeof v !== 'object' || v instanceof Date) return 0;
  return Array.isArray(v) ? v.length : Object.keys(v).length;
}

function stats(value) {
  var nodes = 0, depth = 0;
  (function walk(v, d) {
    nodes++;
    if (d > depth) depth = d;
    if (v && typeof v === 'object' && !(v instanceof Date)) {
      if (Array.isArray(v)) for (var i = 0; i < v.length; i++) walk(v[i], d + 1);
      else for (var k in v) walk(v[k], d + 1);
    }
  })(value, 1);
  return LintApp.fmtNum(nodes) + ' nodes, depth ' + depth;
}

/* ==========================================================================
   Tree adapter
   ========================================================================== */
var IDENT = /^[A-Za-z_$][A-Za-z0-9_$]*$/;

function pathString(path) {
  var s = '$';
  for (var i = 0; i < path.length; i++) {
    var seg = path[i];
    if (typeof seg === 'number') s += '[' + seg + ']';
    else if (IDENT.test(seg)) s += '.' + seg;
    else s += '[' + JSON.stringify(seg) + ']';
  }
  return s;
}

var TICON = {
  object: ['obj', '{}'], array: ['arr', '[]'], string: ['str', 'ab'],
  number: ['num', '#'], boolean: ['bool', '◑'], null: ['null', '∅'],
  date: ['date', '@']
};

var adapter = {
  pathLabel: 'Path',

  rootEntry: function (value) { return { key: undefined, value: value, path: [] }; },

  children: function (e) {
    var v = e.value;
    if (!v || typeof v !== 'object' || v instanceof Date) return [];
    var out = [];
    if (Array.isArray(v)) {
      for (var i = 0; i < v.length; i++) {
        out.push({ key: i, value: v[i], path: e.path.concat([i]) });
      }
    } else {
      var keys = Object.keys(v);
      for (var j = 0; j < keys.length; j++) {
        out.push({ key: keys[j], value: v[keys[j]], path: e.path.concat([keys[j]]) });
      }
    }
    return out;
  },

  childCount: function (e) { return sizeOf(e.value); },

  matches: function (e, q) {
    if (typeof e.key === 'string' && e.key.toLowerCase().indexOf(q) !== -1) return true;
    var t = typeOf(e.value);
    if (t === 'object' || t === 'array') return false;
    var s = t === 'date' ? e.value.toISOString() : String(e.value);
    return s.toLowerCase().indexOf(q) !== -1;
  },

  path: function (e) { return pathString(e.path); },

  decorate: function (row, e, q, util) {
    var t = typeOf(e.value);
    var spec = TICON[t] || TICON.object;

    var icon = document.createElement('span');
    icon.className = 'ticon t-' + spec[0];
    icon.textContent = t === 'boolean' ? (e.value ? '✓' : '✕') : spec[1];
    icon.title = t;
    row.appendChild(icon);

    if (e.key !== undefined) {
      var k = document.createElement('span');
      k.className = 'k' + (typeof e.key === 'number' ? ' idx' : '');
      util.highlightInto(k, typeof e.key === 'number' ? '[' + e.key + ']' : String(e.key), q);
      row.appendChild(k);
      var colon = document.createElement('span');
      colon.className = 'colon';
      colon.textContent = ':';
      row.appendChild(colon);
    }

    if (t === 'object' || t === 'array') {
      var n = sizeOf(e.value);
      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = t === 'array' ? (n ? '[ … ]' : '[ ]') : (n ? '{ … }' : '{ }');
      if (n) {
        var cnt = document.createElement('span');
        cnt.className = 'cnt';
        cnt.textContent = n + (t === 'array'
          ? (n === 1 ? ' item' : ' items')
          : (n === 1 ? ' key' : ' keys'));
        badge.appendChild(cnt);
      }
      row.appendChild(badge);
    } else {
      var v = document.createElement('span');
      v.className = 'v ' + (t === 'boolean' ? 'bool' : t === 'string' ? 'str' : t);
      var text = t === 'date' ? e.value.toISOString() : String(e.value);
      if (text.length > util.STR_TRUNC) {
        var full = text;
        util.highlightInto(v, full.slice(0, util.STR_TRUNC) + '…', q);
        var more = document.createElement('button');
        more.className = 'trunc-btn';
        more.textContent = '+' + LintApp.fmtNum(full.length - util.STR_TRUNC) + ' chars';
        more.addEventListener('click', function (ev) {
          ev.stopPropagation();
          v.textContent = '';
          util.highlightInto(v, full, q);
        });
        v.appendChild(more);
      } else {
        util.highlightInto(v, text, q);
      }
      row.appendChild(v);
    }
  },

  actions: function (e) {
    return [
      { label: 'path', title: 'Copy the path to this node', toastLabel: 'Path',
        get: function () { return pathString(e.path); } },
      { label: 'yaml', title: 'Copy this node as YAML', toastLabel: 'YAML',
        get: function () {
          try { return jsyaml.dump(e.value, { indent: 2, lineWidth: -1, noRefs: true }); }
          catch (err) { return String(e.value); }
        } },
      { label: 'json', title: 'Copy this node as JSON', toastLabel: 'JSON',
        get: function () { return JSON.stringify(e.value, null, 2); } }
    ];
  }
};

var SAMPLE = `# Deployment for the checkout service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: production
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: lint-platform
    environment: prod
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
        tier: backend
    spec:
      containers:
        - name: server
          image: ghcr.io/lint-uz/checkout:v2.4.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1000m, memory: 1Gi }
          env:
            - name: NODE_ENV
              value: production
            - name: CACHE_TTL_SECONDS
              value: "3600"
            - name: ENABLE_SPLIT_PAYMENT
              value: "false"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          notes: >
            Rate limits are per API key. The burst allowance refills
            at the window rate and is shared across all endpoints.
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api-svc
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: checkout-api
  ports:
    - name: http
      port: 80
      targetPort: 8080`;

/* ==========================================================================
   Boot
   ========================================================================== */
var lastMulti = null;

var app = LintApp.init({
  id: 'yaml',
  label: 'YAML',
  parse: function (text) {
    var res = parse(text);
    lastMulti = res.ok && res.multi ? res.count : null;
    return res;
  },
  stats: function (value) {
    var base = stats(value);
    return lastMulti ? lastMulti + ' documents, ' + base : base;
  },
  adapter: adapter,
  highlighter: highlight,
  autoDepth: 3,
  emptyHTML: LintApp.emptyState({
    title: 'Paste YAML to see it as a tree',
    body: 'Expand it, search it and copy the path to any value. ' +
      'Multi-document files load as a list.',
    extra: '<div class="empty-actions"><button class="bordered" data-empty="sample">Load a sample</button></div>'
  }),
  sample: SAMPLE
});

document.getElementById('btnFormat').addEventListener('click', function () {
  var text = app.editor.getValue();
  var res = parse(text);
  if (!res.ok) { app.run(); LintApp.toast('Fix the YAML before formatting'); return; }
  try {
    var opts = { indent: 2, lineWidth: -1, noRefs: true };
    var out = res.multi
      ? jsyaml.loadAll(text).map(function (d) { return jsyaml.dump(d, opts); }).join('---\n')
      : jsyaml.dump(res.value, opts);
    app.editor.setValue(out);
    LintApp.toast('Formatted');
  } catch (e) {
    LintApp.toast('Could not format: ' + e.message);
  }
});

document.getElementById('btnToJson').addEventListener('click', function () {
  var res = parse(app.editor.getValue());
  if (!res.ok) { app.run(); LintApp.toast('Fix the YAML before converting'); return; }
  LintApp.copyAndOffer(JSON.stringify(res.value, null, 2), 'JSON', 'yaml', 'json');
});

document.getElementById('btnToYaml').addEventListener('click', function () {
  var raw = app.editor.getValue().trim();
  if (!raw) return;
  try {
    var value = JSON.parse(raw);
    app.editor.setValue(jsyaml.dump(value, { indent: 2, lineWidth: -1, noRefs: true }));
    LintApp.toast('Converted from JSON');
  } catch (e) {
    LintApp.toast('The editor does not hold valid JSON');
  }
});
})();
</script>
</body>
</html>
