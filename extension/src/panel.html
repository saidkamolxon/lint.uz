<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lint.one</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="/shared/app.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="panel.css">
<script src="ui-theme.js"></script>
</head>
<body class="panel">
<div class="app">
  <header class="toolbar">
    <span class="logo" title="lint.one">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-name">lint<span class="logo-tld">.one</span></span>
    </span>
    <span class="sep"></span>
    <div class="seg" id="filters" role="group" aria-label="Show"></div>
    <div class="search-wrap filter-wrap">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input type="search" id="filter" placeholder="Filter by address" spellcheck="false" autocomplete="off">
    </div>
    <span class="spacer"></span>
    <label class="preserve" title="Keep the list when the page reloads or navigates">
      <input type="checkbox" id="preserve"> Preserve list
    </label>
    <button type="button" class="icon-btn" id="clear" title="Clear the list" aria-label="Clear the list">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m4 12 8-8" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </header>

  <div class="list" id="list" aria-label="Responses"></div>

  <div class="empty-state" id="empty">
    <h2>Nothing to open yet</h2>
    <p>Responses this page loads that lint.one reads — JSON, XML, YAML, CSV, logs, PDFs, SQLite and audio — show up here. Reload the page to catch the ones it loaded first.</p>
  </div>

  <footer class="status">
    <span id="count">0 responses</span>
    <span class="spacer"></span>
    <span class="hint">Click one to open it in lint.one, in a new tab. Nothing is uploaded.</span>
  </footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="base.js"></script>
<script src="formats.js"></script>
<script src="panel.js"></script>
</body>
</html>
